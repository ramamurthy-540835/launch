name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Cloud Run staging
        shell: bash
        run: >-
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}"
          --source .
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --service-account "${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}"
          --allow-unauthenticated
          --set-env-vars "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},BIGQUERY_DATASET=school_lunch,BIGQUERY_ORDERS_TABLE=orders,GCS_BUCKET=${{ vars.GCS_BUCKET }},FIRESTORE_DATABASE_ID=(default),PAYMENT_HOLD_MINUTES=15,NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}"
          --set-build-env-vars "NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }},NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }},NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}"
          --set-secrets "RAZORPAY_KEY_ID=razorpay-key-id:latest,RAZORPAY_KEY_SECRET=razorpay-key-secret:latest,RAZORPAY_WEBHOOK_SECRET=razorpay-webhook-secret:latest,PAYMENT_EXPIRY_TASK_SECRET=payment-expiry-task-secret:latest"
